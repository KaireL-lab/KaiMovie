name: Build KaiMovie APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KaiMovie.apk

      - name: Get date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ steps.date.outputs.date }}
          name: KaiMovie APK v1.0
          body: |
            ## KaiMovie APK (Ad-Free)
            
            Download **KaiMovie.apk** di bawah lalu install di HP Android kamu.
            
            **Fitur:**
            - Built-in ad blocker (tanpa iklan)
            - Block popup & redirect
            - Fullscreen video support
            - UI premium modern
            
            **Cara install:**
            1. Download file KaiMovie.apk
            2. Buka file yang sudah di-download
            3. Izinkan "Install dari sumber tidak dikenal"
            4. Klik Install
          files: android/app/build/outputs/apk/debug/KaiMovie.apk
