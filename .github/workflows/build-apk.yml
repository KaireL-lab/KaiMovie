name: Build KaiMovie APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Create consistent keystore
        working-directory: android
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
            -storepass kaimovie123 -keypass kaimovie123 \
            -alias kaimovie -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=KaiMovie, OU=Dev, O=KaiMovie, L=ID, ST=ID, C=ID"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace -Pandroid.injected.signing.store.file=$PWD/app/debug.keystore -Pandroid.injected.signing.store.password=kaimovie123 -Pandroid.injected.signing.key.alias=kaimovie -Pandroid.injected.signing.key.password=kaimovie123

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KaiMovie.apk

      - name: Delete old release
        run: gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete old tag
        run: git push origin :refs/tags/latest || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KaiMovie APK
          body: |
            ## KaiMovie APK (Ad-Free)
            
            Download **KaiMovie.apk** di bawah lalu install di HP Android kamu.
            
            **Fitur:**
            - Built-in ad blocker (tanpa iklan)
            - Block popup & redirect
            - Fullscreen video support
            - UI premium modern
            
            **Cara install:**
            1. Download file KaiMovie.apk
            2. Buka file yang sudah di-download
            3. Izinkan "Install dari sumber tidak dikenal"
            4. Klik Install
          files: android/app/build/outputs/apk/debug/KaiMovie.apk
